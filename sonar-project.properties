# Scaffold local — reemplazar con los valores reales al conectar un servidor Sonar
# (SonarCloud o SonarQube self-hosted). Ver ADR-009.
#
# Sin sonar.host.url, el scanner apunta por defecto a SonarCloud y exige
# sonar.organization (con un token vía SONAR_TOKEN). Para SonarQube self-hosted,
# definir sonar.host.url=<url-del-servidor> en su lugar.
# sonar.organization=<pendiente>
sonar.projectKey=exercise-todo
sonar.projectName=exercise-todo
sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.spec.ts
sonar.exclusions=**/*.test.ts,**/*.test.tsx,.next/**,coverage/**,playwright-report/**,test-results/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
